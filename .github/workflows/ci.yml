name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs every check first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, types, build, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: What npm would publish
        run: npm run check:pack
      - name: package.json, server.json and the .mcpb manifest agree
        run: npm run check:metadata
      - name: Build the Claude Desktop extension
        run: npm run build:mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: plesk-deploy-mcp-mcpb
          path: build/*.mcpb
          if-no-files-found: error
          retention-days: 14

  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  sshd:
    name: Integration (real sshd in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: SSH tools against a real sshd and the real release manager
        env:
          PLESK_IT_SSHD: '1'
        run: npm run test:integration
