# /etc/acme/deploy.conf in the integration container: a static site, so no
# process manager; health is read from files.
BASE=/var/www/acme-app
APP_USER=root
APP_GROUP=root
INCOMING=/home/acme-deploy/incoming
PROCESS_MANAGER=none
REQUIRED_FILES="RELEASE.txt HEALTH"
HEALTH_CHECKS="file:///var/www/acme-app/current/HEALTH|ok"
HEALTH_COMMIT_URL=file:///var/www/acme-app/current/RELEASE.txt
HEALTH_TIMEOUT_SECONDS=5
KEEP_RELEASES=5
LOG_FILE=/var/log/acme-deploy.log
LOCK_FILE=/var/lock/acme-deploy.lock
