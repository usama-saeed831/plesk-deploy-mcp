# TEMPLATE — Plesk: Websites & Domains → <domain> → Apache & nginx Settings →
# "Additional nginx directives", for a domain whose app listens on a local port.
#
# Only use it if the domain does not already proxy to the app (check the
# existing directives and /var/www/vhosts/system/<domain>/conf/vhost_nginx.conf
# first; a working proxy is left alone).
#
# Also on that page: turn OFF "Serve static files directly by nginx" (or "Smart
# static files processing") so requests reach the app, and make sure the
# domain has no PHP/Passenger app answering for the same location.
# If Plesk reports `duplicate location "/"`, it already generates one for this
# domain: see references/troubleshooting.md, do not edit generated files.
#
# ADAPT: the port. Keep it closed to the outside in the firewall.

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Larger uploads than nginx's default 1 MB, if the app accepts them:
# client_max_body_size 20m;
