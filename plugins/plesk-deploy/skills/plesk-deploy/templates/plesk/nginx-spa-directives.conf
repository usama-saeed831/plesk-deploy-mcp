# TEMPLATE — Plesk "Additional nginx directives" for a single-page app (React,
# Vite, Angular) whose document root is <BASE>/current, served by nginx.
#
# Client-side routes (/dashboard/42) don't exist as files, so unknown paths
# fall back to index.html. index.html itself is never cached, so browsers pick
# up a new release; hashed assets are cached for a year.
#
# If Plesk reports `duplicate location "/"`, the domain's generated config
# already has one (usually because Apache handles requests behind nginx).
# Then use an .htaccess in the build output instead:
#
#   RewriteEngine On
#   RewriteCond %{REQUEST_FILENAME} !-f
#   RewriteCond %{REQUEST_FILENAME} !-d
#   RewriteRule ^ index.html [L]
#
# Check which one serves the domain before choosing (references/discovery.md).

location / {
    try_files $uri $uri/ /index.html;
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

location = /version.json {
    add_header Cache-Control "no-store";
}

location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|avif|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
